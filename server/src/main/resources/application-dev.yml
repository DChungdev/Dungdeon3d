# Profile: dev — cloud dev server (Phase 0 week 6). Everything secret comes from env vars;
# startup fails if one is missing, rather than silently using a dev default.
#
#   DB_URL       jdbc:postgresql://<host>:5432/dungeon_delvers
#   DB_USER / DB_PASSWORD
#   JWT_SECRET   ≥ 32 random characters
#   CORS_ORIGINS optional, default "*"

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

ddo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-sec: 900
    refresh-token-ttl-sec: 604800
  cache:
    type: memory
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  game:
    hub-max-players-per-shard: 30
    instance-max-players: 4
    instance-idle-timeout-sec: 300
    combat-tick-hz: 10
    reconnect-grace-sec: 60

logging:
  level:
    root: INFO
    com.dungeondelvers: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
